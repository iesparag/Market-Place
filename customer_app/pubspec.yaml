name: customer_app
description: Marketplace customer app — multi-vendor, BB/Blinkit-style.
publish_to: 'none'
version: 1.0.17+57

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1        # state (NgRx equivalent)
  go_router: ^14.2.0             # routing + deep links
  dio: ^5.4.3+1                  # HTTP + interceptors (auth/refresh)
  flutter_secure_storage: ^9.2.2 # JWT tokens
  shared_preferences: ^2.2.3     # local cart persistence
  cached_network_image: ^3.3.1   # product images
  url_launcher: ^6.3.0           # open the update link (Play Store / APK)
  intl: ^0.19.0                  # ₹ formatting
  speech_to_text: ^7.0.0         # voice search (mic → text)
  razorpay_flutter: ^1.3.7       # UPI / cards / netbanking / wallets (India)
  package_info_plus: ^9.0.1
  socket_io_client: ^2.0.3+1     # live order room: status + rider location pushes
  flutter_map: ^7.0.2            # free OSM map for live rider tracking, no API key
  latlong2: ^0.9.1               # LatLng type for flutter_map
  lottie: ^3.1.2                 # festival greeting animations (admin-configured)
  firebase_core: ^3.8.0          # required before any other Firebase plugin
  firebase_messaging: ^15.1.5    # push notifications (order/payment/delivery/promo/cart)
  geolocator: ^13.0.1            # device GPS for "Shops near you" + live location bar
  share_plus: ^10.1.2            # native share sheet (invite-a-friend referral link)

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1  # generates the launcher icon for all densities

# Launcher icon: brand green + shopping bag. Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#EA580C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/lottie/
