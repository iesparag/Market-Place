name: rider_app
description: Marketplace delivery rider app — accept jobs, navigate, deliver.
publish_to: 'none'
version: 1.0.0+14

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1        # state (matches customer_app)
  go_router: ^14.2.0             # routing
  dio: ^5.4.3+1                  # HTTP + interceptors (auth/refresh)
  flutter_secure_storage: ^9.2.2 # JWT token
  socket_io_client: ^2.0.3+1     # live task offers (future: push instead of polling)
  geolocator: ^13.0.1            # GPS — the one thing customer_app never needed
  intl: ^0.19.0                  # ₹ formatting
  flutter_tts: ^4.2.0            # spoken task-assigned alert — audible over riding noise
  permission_handler: ^11.3.1    # POST_NOTIFICATIONS (Android 13+) for alerts
  firebase_core: ^3.8.0          # required before any other Firebase plugin
  firebase_messaging: ^15.1.5    # push notifications (new task offer/assignment)
  flutter_background_service: ^5.1.0  # keeps location pings flowing while the app is backgrounded
  url_launcher: ^6.3.0            # call customer/vendor, open turn-by-turn navigation
  collection: ^1.19.0              # firstOrNull

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1  # generates the launcher icon for all densities

# Launcher icon: same orange family as customer_app, delivery-scooter glyph to stay
# visually distinct on a home screen with both apps installed. Run after changing:
# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#EA580C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
